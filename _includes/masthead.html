<header class="site-masthead">
  <div class="site-masthead__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul class="site-nav__links">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
