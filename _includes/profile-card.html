<aside class="profile-card" aria-label="About Jari Peeperkorn">
  <a class="profile-card__portrait" href="{{ '/' | relative_url }}" aria-label="Jari Peeperkorn: home">
    <img src="{{ '/images/profile-web.jpg' | relative_url }}" width="480" height="465" alt="Jari Peeperkorn" decoding="async">
  </a>
  <div class="profile-card__intro">
    <p class="profile-card__name">{{ site.author.name }}</p>
    <p class="profile-card__role">FWO Postdoctoral Researcher</p>
    <p class="profile-card__affiliation">LIRIS &middot; KU Leuven<br>Belgium</p>
  </div>
  <details class="profile-links" open>
    <summary>Contact &amp; profiles</summary>
    <ul>
      <li><a href="mailto:{{ site.author.email }}">Email me <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="{{ site.author.googlescholar }}">Google Scholar <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="{{ site.author.orcid }}">ORCID <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="https://dblp.uni-trier.de/pid/274/3341.html">DBLP <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="https://github.com/{{ site.author.github }}">GitHub <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/">LinkedIn <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="{{ site.author.researchgate }}">ResearchGate <span aria-hidden="true">&nearr;</span></a></li>
      <li><a href="https://twitter.com/{{ site.author.twitter }}">X / Twitter <span aria-hidden="true">&nearr;</span></a></li>
    </ul>
  </details>
</aside>
