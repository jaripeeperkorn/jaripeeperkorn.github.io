<aside class="profile-card" aria-label="About Jari Peeperkorn">
  <a class="profile-card__portrait" href="{{ '/' | relative_url }}" aria-label="Jari Peeperkorn: home">
    <img src="{{ '/images/profile-web.jpg' | relative_url }}" width="480" height="465" alt="Jari Peeperkorn" decoding="async">
  </a>
  <div class="profile-card__intro">
    <p class="profile-card__name">{{ site.author.name }}</p>
    <p class="profile-card__role">FWO Postdoctoral Researcher</p>
    <p class="profile-card__affiliation">LIRIS &middot; KU Leuven<br>Belgium</p>
  </div>
  <details class="profile-links" open>
    <summary>Contact &amp; profiles</summary>
    <ul>
      <li><a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope profile-links__icon" aria-hidden="true"></i>Email me</a></li>
      <li><a href="{{ site.author.googlescholar }}"><i class="ai ai-google-scholar profile-links__icon" aria-hidden="true"></i>Google Scholar</a></li>
      <li><a href="{{ site.author.orcid }}"><i class="ai ai-orcid profile-links__icon" aria-hidden="true"></i>ORCID</a></li>
      <li><a href="https://dblp.uni-trier.de/pid/274/3341.html"><i class="ai ai-dblp profile-links__icon" aria-hidden="true"></i>DBLP</a></li>
      <li><a href="https://github.com/{{ site.author.github }}"><i class="fab fa-github profile-links__icon" aria-hidden="true"></i>GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/"><i class="fab fa-linkedin profile-links__icon" aria-hidden="true"></i>LinkedIn</a></li>
      <li><a href="{{ site.author.researchgate }}"><i class="ai ai-researchgate profile-links__icon" aria-hidden="true"></i>ResearchGate</a></li>
      <li><a href="https://twitter.com/{{ site.author.twitter }}"><i class="fab fa-x-twitter profile-links__icon" aria-hidden="true"></i>X / Twitter</a></li>
    </ul>
  </details>
</aside>
