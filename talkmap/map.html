
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk locations — Jari Peeperkorn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.css">
  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.css">
  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="leaflet_dist/screen.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.js"></script>
  <script src="leaflet_dist/leaflet.markercluster-src.js"></script>
  <script src="org-locations.js"></script>
</head>
<body>
  <div id="map" role="region" aria-label="Map of conference and talk locations"></div>
  <noscript><p class="map-fallback">Enable JavaScript to explore the map, or <a href="/talks/" target="_parent">view all talks</a>.</p></noscript>
  <script>
    var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
    });
    var map = L.map('map', { layers: [tiles], scrollWheelZoom: false });
    var markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 48 });

    addressPoints.forEach(function (talk) {
      var popup = document.createElement('div');
      var title = document.createElement('a');
      title.className = 'map-talk-title';
      title.href = talk.url;
      title.target = '_parent';
      title.textContent = talk.title;
      popup.appendChild(title);

      var details = document.createElement('p');
      details.className = 'map-talk-meta';
      var date = new Date(talk.date + 'T12:00:00');
      details.textContent = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' + talk.location;
      popup.appendChild(details);

      if (talk.slides_url) {
        var slides = document.createElement('a');
        slides.href = talk.slides_url;
        slides.target = '_parent';
        slides.textContent = 'Slides (' + talk.slides_format + ')';
        popup.appendChild(slides);
      }

      var marker = L.marker([talk.lat, talk.lng], { title: talk.title, alt: talk.title });
      marker.bindPopup(popup, { maxWidth: 260 });
      markers.addLayer(marker);
    });

    map.addLayer(markers);
    map.fitBounds(markers.getBounds(), { padding: [24, 24] });
  </script>
</body>
</html>
